<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alibi · proof</title>
<meta name="description" content="Every Tatum call, Walrus Memory write, Sui transaction and test behind Alibi, counted from the proof files.">
<meta name="theme-color" content="#0B1030">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="/" aria-label="Alibi home"><span class="mark" aria-hidden="true"></span>alibi</a>
  <nav class="links" id="links" aria-label="Sections"><a href="/#learned">Learned</a><a href="/#evidence">Evidence</a><a href="/#plans">Plans</a></nav>
  <div class="nav-right">
    <button type="button" class="menu-btn" aria-expanded="false" aria-controls="links">Menu</button>
    <a class="nav-cta" href="/">Check a market</a>
  </div>
</header>
<main>
  <section class="page-head">
    <p class="kicker">Proof</p>
    <h1><span>Counted from the files, not typed in</span></h1>
    <p class="lede">Every number here is read from Alibi's proof files when you open this page.</p>
    <p class="mfoot mono" id="gen"></p>
  </section>
  <section class="section" style="padding-top:16px">
    <div class="proof-grid" id="grid"><div class="glass pcard span2"><p>Loading proof files…</p></div></div>
  </section>
</main>
<footer class="foot">
  <p class="built">Built on <span class="cred"><img src="/brand/tatum-icon.svg" alt="" width="18" height="14"><strong>Tatum</strong> (Sui gRPC)</span> · <span class="cred"><img src="/brand/walrus-memory-favicon.svg" alt="" width="16" height="16"><strong>Walrus Memory</strong></span> · <strong>Pyth</strong></p>
  <p class="foot-links"><a href="/">Home</a><a href="/proof">Proof</a></p>
</footer>
<script src="/proof.js" defer></script>
<script>
  // mobile menu (same behaviour as the home page)
  (() => { const b = document.querySelector('.menu-btn'), l = document.getElementById('links'); b && b.addEventListener('click', () => { const o = b.getAttribute('aria-expanded') !== 'true'; b.setAttribute('aria-expanded', o); l.classList.toggle('open', o); }); })();
</script>
</body>
</html>
